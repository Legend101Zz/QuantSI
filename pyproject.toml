[project]
name = "QuantSI"
description = "Pragmatic dimensional checking for NumPy-based SI calculations"
authors = [
    {name = "Sorin Birchi"},
    {name = "Marcel Stimberg"},
    {name = "Dan Goodman"},
    {name = "Romain Brette"},
]
dependencies = ["numpy>=2.2"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "GPLv3"}
keywords = ['SI', 'SI units', 'unit system', 'physical quantities']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering'
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-xdist>=1.22.3",
    "pdm-backend>=2.4.3",
    "pytest-cov>=6.1.1",
    "pytest-benchmark>=5.1",
    "sympy>=1.2",  # only to test that SymPy can still print quantities
    "ruff>=0.16,<0.17",
    "pre-commit>=4.2.0",
]
docs = [
    "sphinx>=7",
    "ipython>=5",
    "sphinx-tabs>=3.4.7",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"
tag_filter = "v*"
version_format = "src.version_helper:format_version"
write_to = "QuantSI/_version.py"
write_template = "__version__ = '{}'"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["src/QuantSI"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--benchmark-disable",  # run each benchmark once, as a plain test
    "-m",
    "not perf_guard",  # run explicitly with: pytest -m perf_guard
]
markers = [
    "perf_guard: compares QuantSI overhead with plain NumPy (select with -m perf_guard)",
]
xfail_strict = true
# Treat warnings as errors, so that deprecations show up early. A test that
# expects a warning can allow it with @pytest.mark.filterwarnings.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/QuantSI/allunits.py"]  # generated file, not edited by hand

[tool.ruff.lint]
# List the rules ourselves, so that a new Ruff release can't change what CI checks.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Keep explicit re-exports ("import x as x") together in one statement.
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true
